<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f9f9f9;
            color: #333;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .social-icons a {
            margin: 0 10px;
            display: inline-block;
        }
        .social-icons img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #333;
            padding: 8px 12px;
        }
        .date-time {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <img src="fotoprofil.jpeg" alt="Foto Profil" class="profile-pic">

    <h1>Hainur Fadillah</h1>
    <h2>102022430032</h2>
    <h3>Fakultas Rekayasa Industri</h3>
    <h4>Program Studi S1 Sistem Informasi</h4>

    <div class="social-icons">
        <a href="https://github.com/Hainurrr" target="_blank">
            <img src="github-icon.png" alt="GitHub">
        </a>
        <a href="https://instagram.com/hainuurr" target="_blank">
            <img src="ig-icon.png" alt="Instagram">
        </a>
        <a href="https://x.com/username" target="_blank">
            <img src="x-icon.png" alt="X">
        </a>
    </div>

    <div class="date-time">
        Tanggal dan Waktu saat ini: <span id="datetime"></span>
    </div>

    <script>
        const dt = new Date();
        document.getElementById("datetime").innerHTML = dt.toLocaleString();
    </script>

</body>
</html>
